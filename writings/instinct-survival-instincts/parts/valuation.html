<figure class="vz" aria-hidden="true">
  <svg viewBox="0 0 720 452" role="presentation">
    <!-- Areas are to scale: $10B is four times the area of $2.5B; money raised and yearly volume use the same scale. -->
    <g class="vz-aug">
      <text class="vz-date" x="60" y="212">August 2026</text>
      <text class="vz-big" x="60" y="242">$2.5B valuation</text>
      <rect class="vz-val" x="60" y="250" width="150" height="150"/>
      <rect class="vz-raised" x="60" y="353" width="47" height="47"/>
      <text class="vz-small" x="60" y="424">$250M raised</text>
    </g>
    <g class="vz-sep">
      <text class="vz-date" x="270" y="62">September 28, 2026</text>
      <text class="vz-big" x="270" y="92">$10B valuation</text>
      <rect class="vz-val" x="270" y="100" width="300" height="300"/>
      <rect class="vz-raised" x="270" y="305" width="95" height="95"/>
      <text class="vz-small" x="270" y="424">$1B raised</text>
      <text class="vz-times" x="420" y="225" text-anchor="middle">4×</text>
    </g>
    <g class="vz-flow">
      <rect class="vz-vol" x="605" y="305" width="95" height="95"/>
      <text class="vz-small" x="700" y="424" text-anchor="end">~$1B a year</text>
      <text class="vz-small" x="700" y="446" text-anchor="end">spent through it</text>
    </g>
    <line class="vz-base" x1="40" y1="400" x2="710" y2="400"/>
  </svg>
  <figcaption class="vz-caption">
    <span class="vz-q">What changed in the underlying business?</span>
    <span class="vz-note">Public details on users, revenue and unit economics: limited.</span>
    <span class="vz-key"><span><i class="k-val"></i>Valuation</span><span><i class="k-raised"></i>Money raised</span><span><i class="k-vol"></i>Spending through Instinct (reported, not revenue)</span></span>
  </figcaption>
</figure>
