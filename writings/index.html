<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Writing by Yashaswi Sunkara">
    <title>Writings — Yashaswi Sunkara</title>
    <link rel="stylesheet" href="../css/styles.css?v=2">
    <style>
        body {
            min-height: 100vh;
            display: block;
        }

        .writing-page {
            width: min(100% - 4rem, 900px);
            margin: 0 auto;
            padding: 5rem 0;
        }

        .writing-page header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 2rem;
        }

        .writing-page h1 {
            font-size: clamp(3rem, 9vw, 6rem);
            font-weight: 400;
            letter-spacing: -0.03em;
        }

        .writing-page a {
            color: var(--color-text);
            text-underline-offset: 0.2em;
        }

        .writing-intro {
            max-width: 620px;
            margin-top: 4rem;
            font-size: clamp(1.4rem, 3vw, 2rem);
            line-height: 1.35;
        }

        @media (max-width: 600px) {
            .writing-page {
                width: min(100% - 3rem, 900px);
                padding: 2rem 0;
            }

            .writing-page header {
                align-items: flex-start;
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <main class="writing-page">
        <header>
            <h1>Writings</h1>
            <a href="/" aria-label="Return to Yashaswi Sunkara's portfolio">Home</a>
        </header>
        <p class="writing-intro">Essays, notes, and ideas from Yashaswi Sunkara. New writing is on its way.</p>
    </main>
</body>

</html>
