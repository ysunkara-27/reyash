[build]
  command = "mkdir -p .netlify-publish/officehours .netlify-publish/savetheworld && cp index.html .netlify-publish/ && cp -R assets bidpoints css js apgovelections rides dog pujarinet kwatnoskiapgov .netlify-publish/ && cd savetheworld && npm ci && npm run build && cp -R dist/. ../.netlify-publish/savetheworld/ && cd ../officehours/ux-studio-screen-main && npm ci && npm run build && cp -R out/. ../../.netlify-publish/officehours/"
  publish = ".netlify-publish"

# Revalidate planner assets so independently cached files cannot strand a release.
[[headers]]
  for = "/dog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
